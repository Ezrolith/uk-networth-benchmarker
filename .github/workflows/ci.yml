name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    strategy:
      # Streamlit Cloud currently runs Python 3.14 — test on a representative
      # range so a version-specific regression (e.g. a syntax / stdlib change
      # in 3.13's improved-error-messages behaviour) is caught here, not in
      # production. Add 3.14 to the matrix once GH Actions' setup-python
      # ships a stable 3.14 image (currently 3.14 is RC).
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install test dependencies
        run: pip install pytest

      - name: Syntax check (py_compile every .py file)
        run: python scripts/compile_check.py

      - name: Run tests
        run: pytest -v --tb=short

      - name: Verify charts/ package imports cleanly (smoke test)
        run: python -c "import charts; print('charts imports:', sorted(charts.__all__))"
