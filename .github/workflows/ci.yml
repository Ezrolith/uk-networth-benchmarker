name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    strategy:
      # Streamlit Community Cloud defaults to the newest Python that Streamlit
      # supports, which is currently 3.14 — so 3.14 MUST stay in this matrix or
      # production runs an interpreter CI never exercises. 3.11 is the floor
      # declared in pyproject.toml (requires-python); the versions between are
      # there to catch version-specific regressions before deploy.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install test dependencies
        run: pip install pytest

      - name: Syntax check (py_compile every .py file)
        run: python scripts/compile_check.py

      - name: Run tests
        run: pytest -v --tb=short

      - name: Verify charts/ package imports cleanly (smoke test)
        run: python -c "import charts; print('charts imports:', sorted(charts.__all__))"
