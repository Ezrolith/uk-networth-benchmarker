name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install test dependencies
        run: pip install pytest

      - name: Syntax check (py_compile)
        run: |
          python -m py_compile app.py
          python -m py_compile utils/inference.py
          python -m py_compile utils/data_loader.py
          python -m py_compile utils/monte_carlo.py
          python -m py_compile utils/uk_tax.py
          python -m py_compile charts/__init__.py
          python -m py_compile charts/_helpers.py
          python -m py_compile charts/main_figure.py
          python -m py_compile charts/asset_class.py
          python -m py_compile charts/heatmap.py
          python -m py_compile charts/distribution.py
          python -m py_compile charts/gains.py
          python -m py_compile charts/percentile_trajectory.py
          python -m py_compile charts/whatif.py
          python -m py_compile charts/monte_carlo.py

      - name: Run tests
        run: pytest -v --tb=short

      - name: Verify charts/ package imports cleanly (smoke test)
        run: python -c "import charts; print('charts imports:', sorted(charts.__all__))"
